AWSTemplateFormatVersion: '2010-09-09'
Description: Event-driven serverless file processing - S3 -> Lambda (private subnet) -> SNS

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive SNS alerts

Resources:
  # ---------------- Networking ----------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: file-processing-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: file-processing-igw

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: private-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: file-processing-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for processing Lambda (egress only)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ---------------- SNS ----------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ---------------- IAM ----------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3AndSNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::file-processing-${AWS::AccountId}-${AWS::Region}/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # ---------------- Lambda ----------------
  ProcessingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: file-processing-function
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          TOPIC_ARN: !Ref AlertTopic
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client('s3')
          sns = boto3.client('sns')

          def handler(event, context):
              topic_arn = os.environ['TOPIC_ARN']
              for record in event.get('Records', []):
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(record['s3']['object']['key'])

                  # Skip our own output to avoid an infinite trigger loop
                  if key.startswith('processed/'):
                      continue

                  head = s3.head_object(Bucket=bucket, Key=key)
                  metadata = {
                      'bucket': bucket,
                      'key': key,
                      'size_bytes': head['ContentLength'],
                      'content_type': head.get('ContentType', 'unknown'),
                      'processed_at': datetime.now(timezone.utc).isoformat(),
                      'status': 'PROCESSED'
                  }

                  log_key = 'processed/' + key + '.json'
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2),
                      ContentType='application/json',
                      ServerSideEncryption='AES256'
                  )

                  sns.publish(
                      TopicArn=topic_arn,
                      Subject='File processed successfully',
                      Message=(
                          'File processed successfully.\n\n'
                          f'Bucket: {bucket}\n'
                          f'Key: {key}\n'
                          f'Size: {metadata["size_bytes"]} bytes\n'
                          f'Metadata log: s3://{bucket}/{log_key}\n'
                          f'Time: {metadata["processed_at"]}'
                      )
                  )
              return {'statusCode': 200}

  # Resource-based policy: lets S3 invoke the function
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::file-processing-${AWS::AccountId}-${AWS::Region}

  # ---------------- S3 ----------------
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub file-processing-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessingFunction.Arn

Outputs:
  BucketName:
    Value: !Ref FileBucket
  LambdaFunctionName:
    Value: !Ref ProcessingFunction
  SNSTopicArn:
    Value: !Ref AlertTopic
